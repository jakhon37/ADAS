name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    # GitHub's runner images no longer ship Python 3.8 (the Jetson's interpreter),
    # so every version runs in the official Python image instead.
    container: python:${{ matrix.python-version }}-slim
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Lint with ruff
      run: |
        ruff check src tests

    - name: Run tests
      run: |
        pytest tests/ -v --tb=short

    - name: Test CLI
      run: |
        python src/adas/cli.py --frames 5

  docker:
    runs-on: ubuntu-latest
    needs: test

    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image
      run: |
        docker build -t adas-core:test .

    - name: Test Docker image
      run: |
        docker run --rm adas-core:test --frames 5
