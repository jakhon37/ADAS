# CI for ADAS Core.
#
# WHAT THIS CAN AND CANNOT PROVE
# ------------------------------
# GitHub's hosted runners have no NVIDIA GPU, no CUDA, no TensorRT and no Jetson.
# So this workflow proves: the package imports on the interpreter the board runs
# (3.8), the pure-Python logic is correct, the ops layer (health endpoint, event log,
# metrics registry, watchdog gating) behaves, the deployment assets are syntactically
# valid, and the CPU container builds and runs its tests on both amd64 and arm64.
#
# It CANNOT prove that any .engine loads, that the preprocessing matches the model,
# that the latency budget is met, or that the systemd unit starts. Those are checked
# on the board — see docs/JETSON.md — and no green tick here should be read as
# saying otherwise.
#
# Trigger on every branch: the previous version only ran on `main` and `develop`
# while all the work happened on a feature branch, so it had never run on any of it.

name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install "ruff>=0.3"

      # HARD GATE: real defects only — syntax errors (E9), undefined and unused
      # names (F82/F821, F401), invalid literal comparisons (F632), f-strings with
      # no placeholders (F541). These are bugs, and a red build for them is correct.
      - name: Errors
        run: ruff check --select E9,F src tests

      # SOFT REPORT: the full default rule set currently finds ~900 style findings
      # across the tree (mostly UP006/UP031 modernisation in files this workstream
      # does not own). Failing the build on them would make the badge meaningless on
      # day one. Make it a hard gate once the tree is clean and `[tool.ruff.lint]
      # select` is pinned in pyproject.toml — see the handoff note.
      - name: Style (advisory)
        continue-on-error: true
        run: ruff check --statistics src tests

  test:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.8 is the board. The rest guard against accidentally depending on
        # behaviour that changed later.
        python-version: ['3.8', '3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          # Ultra-Fast-Lane-Detection-v2 is a submodule; without this it is an empty
          # directory and anything that reads its configs fails only in CI.
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # numpy and cv2 are real runtime dependencies of src/adas/perception and
          # src/adas/tracking. opencv-python-headless is the CI stand-in for the
          # board's L4T OpenCV 4.5.4: pinned close to it, and used here only because
          # without cv2 every preprocessing-geometry test would be skipped. The
          # "never pip install opencv" rule applies to the Jetson, where a pip build
          # would shadow the GStreamer-enabled system package.
          pip install "numpy>=1.19" "opencv-python-headless>=4.5.4,<4.6" \
                      "pytest>=7.4,<8.4" "pytest-cov>=4.0"
          pip install -e . --no-deps

      - name: Import on the target interpreter
        run: python -c "import adas, adas.io, adas.core.metrics, adas.core.logger; print(adas.__version__)"

      - name: Unit tests
        run: python -m pytest tests/ -q --tb=short

      - name: Ops-layer coverage gate
        # These four modules are the ones a fleet depends on and the ones that had no
        # tests at all before. Anything below 80% here is a regression, not a style
        # nit, so it fails the build rather than printing a number nobody reads.
        run: |
          python -m pytest tests/test_health.py tests/test_events.py tests/test_metrics.py \
            --cov=adas.io --cov=adas.core.metrics --cov=adas.core.logger \
            --cov-report=term-missing --cov-fail-under=80 -q

      - name: Mock pipeline smoke
        run: PYTHONPATH=src python -m adas.cli --frames 5

      - name: Log level actually takes effect
        # The ADAS-OPS-07 regression guard at the CLI level: --log-level ERROR must
        # silence the per-frame pipeline chatter. (One INFO line from load_config
        # still escapes, because cli.main resolves the level after loading the
        # config; that is a cli.py ordering issue, not a logger one, so the check
        # targets the per-frame loggers specifically.)
        run: |
          set -e
          PYTHONPATH=src python -m adas.cli --frames 5 --log-level ERROR > quiet.log 2>&1
          if grep -qE "adas\.(runtime|planning|control)\..*INFO|INFO.*adas\.runtime" quiet.log; then
            echo "--log-level ERROR did not suppress per-frame INFO output:"; cat quiet.log; exit 1
          fi
          PYTHONPATH=src python -m adas.cli --frames 5 --log-level DEBUG > loud.log 2>&1
          grep -q "DEBUG" loud.log || (echo "--log-level DEBUG produced no DEBUG output:"; cat loud.log; exit 1)
          echo "ok: --log-level is honoured in both directions"

  deploy-assets:
    name: deployment assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Shell syntax and shellcheck
        run: |
          bash -n deploy/setup_jetson.sh
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -S warning deploy/setup_jetson.sh

      - name: Installer dry run (no root, changes nothing)
        run: bash deploy/setup_jetson.sh --dry-run

      - name: systemd unit is valid and hardened
        run: |
          sudo cp deploy/adas.service /etc/systemd/system/adas.service
          # systemd-analyze verify parses the unit and reports unknown directives.
          # It warns about the missing ExecStart binary on a runner with no install,
          # so failures are filtered to real syntax problems.
          systemd-analyze verify /etc/systemd/system/adas.service 2>&1 \
            | grep -v -E "Failed to (create|prepare)|not found|does not exist|Unit .* not found" \
            | tee verify.log
          test ! -s verify.log || (echo "systemd-analyze reported problems"; cat verify.log; exit 1)
          python - <<'PY'
          import sys
          unit = open("deploy/adas.service").read()
          required = ["Type=notify", "WatchdogSec=", "Restart=", "User=adas",
                      "NoNewPrivileges=true", "ProtectSystem=strict", "ProtectHome=true",
                      "PrivateTmp=true", "ReadWritePaths=", "MemoryMax=", "[Install]"]
          missing = [k for k in required if k not in unit]
          sys.exit("adas.service is missing: %s" % missing) if missing else print("unit ok")
          PY

      - name: logrotate config parses
        run: |
          sudo apt-get install -y -qq logrotate
          sudo mkdir -p /var/lib/adas /run/adas
          sudo touch /var/lib/adas/events.jsonl
          logrotate --debug deploy/adas.logrotate

      - name: compose files are valid
        run: docker compose -f docker-compose.yml config --quiet

  docker-ci:
    name: CI image (amd64 + arm64)
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build for both architectures
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false

      - name: Load the native image and run the suite inside it
        run: |
          docker build -t adas-core:ci .
          docker run --rm adas-core:ci
          # A container that exits 0 having done nothing is the ADAS-OPS-02 trap; make
          # the smoke run prove it actually processed frames.
          docker run --rm adas-core:ci python -m adas.cli --frames 5 | tee run.log
          grep -qE "Frame 4|frames" run.log || (echo "container processed no frames"; exit 1)

  docker-jetson:
    name: Jetson image (arm64, build only)
    runs-on: ubuntu-latest
    needs: [test]
    # The L4T base is ~5 GB and pulls from nvcr.io, which rate-limits anonymous
    # pulls. Run it on demand and on the default branch, not on every push.
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build deploy/Dockerfile.jetson for arm64
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.jetson
          platforms: linux/arm64
          push: false
